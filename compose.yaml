services:
  hdu-sniper:
    build:
      context: .
      dockerfile: Containerfile
      args:
        SOURCE_REVISION: "${HDU_SOURCE_REVISION:-unknown}"
    image: localhost/hdu-library-sniper:dev
    container_name: hdu-library-sniper
    env_file:
      - .env.local
    environment:
      HDU_SNIPER_HOME: /var/lib/hdu-sniper
      HDU_WEB_PORT: 8000
      HDU_STRICT_MODE: "1"
      HDU_STRICT_WRITES: "${HDU_STRICT_WRITES:-0}"
      HDU_STRICT_VALIDATED: "${HDU_STRICT_VALIDATED:-0}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${HDU_WEB_PORT:-8000}:8000"
    volumes:
      - hdu-sniper-data:/var/lib/hdu-sniper
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/hdu-sniper-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hdu-sniper-data:
