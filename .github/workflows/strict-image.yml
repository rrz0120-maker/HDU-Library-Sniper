name: V3 deployment acceptance
on:
  push:
    branches: [feat/cloud-strict-v3]
    paths:
      - Containerfile
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - src/**
      - public/**
      - package.json
      - bun.lock
      - scripts/v3-container-smoke.py
      - .github/workflows/strict-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: v3-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Resolve immutable image version
        run: |
          mkdir -p artifacts/p4
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:v3-sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          df -h > artifacts/p4/disk-before.txt
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            -f Containerfile -t "$IMAGE" . 2>&1 | tee artifacts/p4/build.log
      - name: Offline container and persistence acceptance
        run: python3 scripts/v3-container-smoke.py "$IMAGE" --output artifacts/p4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish only after acceptance passes
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" 2>&1 | tee artifacts/p4/push.log
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > artifacts/p4/digests.json
          printf '%s\n' "$IMAGE" > artifacts/p4/image.txt
      - name: Preserve an unverified image for diagnosis if acceptance fails
        if: failure()
        shell: bash
        run: |
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker save "$IMAGE" | gzip > artifacts/p4/unverified-image.tar.gz
          fi
      - name: Retain evidence including failed builds
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v3-acceptance-${{ github.sha }}
          path: artifacts/p4/
          retention-days: 30
