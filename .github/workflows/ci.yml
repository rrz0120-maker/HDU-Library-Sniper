name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # 每天 02:00 Asia/Shanghai，只为预热 Windows release 缓存
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: bun install --frozen-lockfile
      - name: Biome（lint + format）
        run: ./node_modules/.bin/biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Frontend tests and build
        run: bun run test && bun run build
      - name: Browser engines
        run: bun x playwright install --with-deps chromium webkit
      - name: Mobile and iPad Web UI
        run: bun run test:e2e
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy -p hdu-sniper-core -p hdu-sniper-hdu -p hdu-sniper-auth -p hdu-sniper-store -p hdu-sniper-server --all-targets -- -D warnings
      - name: Duplication gate
        run: npx --yes jscpd@4 --min-lines 12 --min-tokens 70 --format rust,typescript,tsx --threshold 3 --ignore "**/node_modules/**,**/target/**,**/ui/**" src crates
      - name: Rust tests
        run: cargo test -p hdu-sniper-core -p hdu-sniper-hdu -p hdu-sniper-auth -p hdu-sniper-store -p hdu-sniper-server

  strict-container:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build distroless image
        run: docker build -f Containerfile -t hdu-v3-test .
      - name: Isolated container health (no library network)
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f hdu-v3-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name hdu-v3-test --network none \
            -e HDU_STRICT_MODE=1 -e HDU_STRICT_WRITES=0 \
            -e HDU_SNIPER_SECRET_KEY="$(openssl rand -base64 32)" hdu-v3-test
          for attempt in {1..20}; do
            if docker exec hdu-v3-test /usr/local/bin/hdu-sniper-server --healthcheck; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  warmup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: .
      - run: bun install --frozen-lockfile
      - name: Build frontend and Rust server
        run: |
          npm run build
          cargo build -p hdu-sniper-server
      - name: Warm release build cache
        working-directory: src-tauri
        run: cargo build --release
